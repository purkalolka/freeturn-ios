name: iOS unsigned IPA

on:
  workflow_dispatch:
    inputs:
      core_ref:
        description: "Ref of purkalolka/free-turn-proxy to build the core from"
        default: main
      tag:
        description: "Release tag (default: build-<run number>)"
        default: ""
      prerelease:
        description: "Publish as pre-release (not marked Latest)"
        type: boolean
        default: false
      notes:
        description: "Release notes (empty = standard text)"
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: purkalolka/free-turn-proxy
          ref: ${{ inputs.core_ref || 'main' }}
          path: core

      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Install xcodegen and gomobile
        run: |
          brew install xcodegen
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build Mobile.xcframework (gomobile bind)
        working-directory: core
        run: |
          go mod download
          gomobile bind -target ios,iossimulator -ldflags "-checklinkname=0" \
            -o "$GITHUB_WORKSPACE/Lib/Mobile.xcframework" ./mobile

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (unsigned)
        run: |
          xcodebuild -project FreeTurn.xcodeproj -scheme FreeTurn -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/FreeTurn.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            DEVELOPMENT_TEAM="" \
            clean archive

      - name: Package IPA
        run: |
          APP="build/FreeTurn.xcarchive/Products/Applications/FreeTurn.app"
          find "$APP" -maxdepth 3
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          (cd build && zip -qry FreeTurn-unsigned.ipa Payload)
          ls -lh build/FreeTurn-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: FreeTurn-unsigned-ipa
          path: build/FreeTurn-unsigned.ipa
          retention-days: 14

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || format('build-{0}', github.run_number) }}
          PRERELEASE: ${{ inputs.prerelease }}
          NOTES_INPUT: ${{ inputs.notes }}
        run: |
          CORE_SHA=$(git -C core rev-parse --short HEAD)
          if [ -n "$NOTES_INPUT" ]; then
            printf '%s\n' "$NOTES_INPUT" > "$RUNNER_TEMP/notes.md"
          else
            echo "Unsigned IPA (sign it yourself, e.g. via flarestore). Core: purkalolka/free-turn-proxy@$CORE_SHA" > "$RUNNER_TEMP/notes.md"
          fi
          FLAGS=()
          if [ "$PRERELEASE" = "true" ]; then FLAGS+=(--prerelease --latest=false); fi
          gh --version | head -1
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/FreeTurn-unsigned.ipa --clobber
          else
            gh release create "$TAG" build/FreeTurn-unsigned.ipa --title "FreeTurn $TAG" --notes-file "$RUNNER_TEMP/notes.md" "${FLAGS[@]}"
          fi
